<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a4c26">
<title>麻將聽牌計算機</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;overflow-x:hidden}
body{background:#f4f6f7;color:#25292d;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC",sans-serif}
.app{width:100%;max-width:760px;margin:auto;min-height:100vh;background:#fff}
.hero{height:150px;padding:38px 22px 0;color:#fff;background:linear-gradient(180deg,#06421f,#0b5a29);box-shadow:inset 0 -28px 48px #001b0a55}
.hero h1{margin:0;font-family:"Noto Serif TC","Songti TC",serif;font-size:29px;line-height:1.2}
.hero p{margin:8px 0;color:#d8eddd;font-size:13px}
.main{padding:18px 20px 42px}
.handHead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.handTitle{color:#bd5a16;font-family:"Noto Serif TC","Songti TC",serif;font-size:26px;font-weight:800}
.mode{display:flex;gap:10px;white-space:nowrap}
.mode button{border:0;background:none;color:#a0a4a8;font-size:17px;padding:4px 0}
.mode button.active{color:#c6530b;border-bottom:2px solid #c6530b;font-weight:700}
.actionRow{display:flex;gap:7px;margin-top:9px}
.soft{border:1px solid #d2d5d9;background:#eceef1;border-radius:9px;padding:8px 14px;font-size:16px;color:#30343a}
.soft:active{transform:translateY(1px)}
.slots{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:4px;margin-top:12px}
.slot{height:62px;border:2px solid #0a6b2a;border-radius:6px;background:#fff;display:flex;align-items:center;justify-content:center;min-width:0}
.slot.empty{border:2px dashed #b5bec7;color:#aeb7bf;font-size:17px}
.tabs{display:flex;border-bottom:2px solid #dfe2e5;margin-top:27px}
.tab{border:0;background:#fff;padding:9px 16px;font-size:19px;color:#9da1a5}
.tab.active{border:2px solid #dfe2e5;border-bottom:2px solid #fff;margin-bottom:-2px;border-radius:7px 7px 0 0;color:#4f555b;font-weight:800}
.palette{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:5px;margin-top:18px}
.tbtn{width:100%;height:70px;border:2px solid #0a6b2a;border-radius:6px;background:#fff;padding:0;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 2px #0002;min-width:0}
.tbtn:active{transform:scale(.97);background:#eef8f0}
.tbtn:disabled{opacity:.35}
.tile{width:40px;height:58px;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;border-radius:5px}.tile img{display:block;width:100%;height:100%;object-fit:contain}.tile img:active{transform:scale(.98)}
.result{margin-top:20px;background:#f7f9fa;border:1px solid #e0e3e6;border-radius:12px;padding:14px}
.big{font-size:23px;font-weight:800}.ok{color:#17833d}.warn{color:#b66a00}.bad{color:#c43d42}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.chip{background:#fff;border:1px solid #cdd5dc;border-radius:8px;padding:6px 9px;font-size:14px}
.note{margin-top:8px;color:#77838e;font-size:13px;line-height:1.55}
@media(max-width:500px){
 .hero{height:132px;padding:30px 17px 0}.hero h1{font-size:25px}.hero p{font-size:12px;margin-top:6px}
 .main{padding:15px 14px 35px}
 .handTitle{font-size:23px}.mode{gap:8px}.mode button{font-size:16px}
 .actionRow{margin-top:7px}.soft{padding:7px 12px;font-size:15px}
 .slots{gap:3px;margin-top:10px}.slot{height:62px;border-radius:5px}.slot.empty{font-size:15px}
 .tabs{margin-top:22px}.tab{padding:8px 13px;font-size:17px}
 .palette{gap:4px;margin-top:14px}
 .tbtn{height:68px;border-width:2px}
 .tile{width:40px;height:57px}
 .wanface{font-size:23px}.wanface .red{font-size:18px}.honorface{font-size:30px}
 .dots{width:32px;height:48px;grid-template-columns:repeat(3,7px);grid-template-rows:repeat(3,7px);gap:3px}
 .dot{width:7px;height:7px}
 .bamboo{grid-template-columns:repeat(3,5px);gap:2px}.bamboo i{width:5px;height:14px}
 .oneDot{width:31px;height:45px;border-width:4px}
 .oneDot:after{width:6px;height:6px;left:7px;top:7px;box-shadow:9px 9px #d43b3b}
}
@media(max-width:370px){
 .main{padding-left:10px;padding-right:10px}
 .palette{gap:3px}.tbtn{height:63px}.tile{width:36px;height:53px}
 .slot{height:58px}
 .mode button{font-size:15px}
}
</style>
</head>
<body>
<div class="app">
<header class="hero">
<h1>麻將聽牌計算機</h1>
<p>手動選牌・快速判斷進聽與等待牌</p>
</header>

<main class="main">
<div class="handHead">
  <div class="handTitle">你的手牌</div>
  <div class="mode">
    <button id="mode13">13張・2進聽</button>
    <button id="mode16" class="active">16張・2進聽</button>
  </div>
</div>

<div class="actionRow">
  <button class="soft" id="undoBtn">↩ 撤回</button>
  <button class="soft" id="sortBtn">排序</button>
  <button class="soft" id="resetBtn">重設</button>
</div>

<div id="slots" class="slots"></div>

<div class="tabs">
  <button class="tab active" id="allTab">所有牌組</button>
  <button class="tab" id="codeTab">牌組代號</button>
</div>

<div id="palette" class="palette"></div>
<div id="result" class="result"></div>
</main>
</div>

<script>
(function(){
"use strict";

var names=[
"1筒","2筒","3筒","4筒","5筒","6筒","7筒","8筒","9筒",
"1條","2條","3條","4條","5條","6條","7條","8條","9條",
"1萬","2萬","3萬","4萬","5萬","6萬","7萬","8萬","9萬",
"東","南","西","北","中","發","白"
];
var wanChars=["一","二","三","四","五","六","七","八","九"];
var honors=["東","南","西","北","中","發","白"];
var hand=[];
var history=[];
var mode=16;

var $=function(id){return document.getElementById(id);};
var slots=$("slots"),palette=$("palette"),result=$("result");
var mode13=$("mode13"),mode16=$("mode16");

function countTile(x){var n=0;for(var i=0;i<hand.length;i++)if(hand[i]===x)n++;return n;}
function counts(a){var c=new Array(34).fill(0);for(var i=0;i<a.length;i++)c[a[i]]++;return c;}

function dotPattern(n){
 var p=[
  [[1,1,"red"]],
  [[0,0,"blueDot"],[2,2,"red"]],
  [[0,0,"blueDot"],[1,1,"red"],[2,2,"green"]],
  [[0,0,"red"],[2,0,"blueDot"],[0,2,"red"],[2,2,"blueDot"]],
  [[0,0,"red"],[2,0,"blueDot"],[1,1,"red"],[0,2,"blueDot"],[2,2,"red"]],
  [[0,0,"blueDot"],[0,1,"red"],[0,2,"green"],[2,0,"blueDot"],[2,1,"red"],[2,2,"green"]],
  [[0,0,"red"],[2,0,"blueDot"],[1,1,"red"],[0,2,"green"],[2,2,"red"],[0,1,"blueDot"],[2,1,"green"]],
  [[0,0,"blueDot"],[0,1,"red"],[0,2,"green"],[2,0,"blueDot"],[2,1,"red"],[2,2,"green"],[1,0,"red"],[1,2,"blueDot"]],
  [[0,0,"red"],[0,1,"green"],[0,2,"red"],[1,0,"blueDot"],[1,1,"red"],[1,2,"green"],[2,0,"red"],[2,1,"blueDot"],[2,2,"red"]]
 ][n-1];
 var s='<div class="dots">';
 for(var i=0;i<p.length;i++)s+='<i class="dot '+p[i][2]+'" style="grid-column:'+(p[i][0]+1)+';grid-row:'+(p[i][1]+1)+'"></i>';
 return s+'</div>';
}
function bamboo(n){
 var s='<div class="bamboo">';
 for(var i=0;i<n;i++)s+='<i></i>';
 return s+'</div>';
}
function tileKey(i){
 if(i<9)return "Pin"+(i+1);
 if(i<18)return "Sou"+(i-8);
 if(i<27)return "Man"+(i-17);
 return ["Ton","Nan","Shaa","Pei","Chun","Hatsu","Haku"][i-27];
}
function visual(i){
 var key=tileKey(i);
 var url="https://raw.githubusercontent.com/FluffyStuff/riichi-mahjong-tiles/master/Regular/"+key+".svg";
 return '<img src="'+url+'" alt="'+names[i]+'" loading="lazy">';
}
function tileHTML(i){return '<div class="tile">'+visual(i)+'</div>';}

function renderSlots(){
 slots.innerHTML="";
 for(var i=0;i<mode;i++){
  var d=document.createElement("div");
  if(i<hand.length){d.className="slot";d.innerHTML=tileHTML(hand[i]);}
  else{d.className="slot empty";d.textContent=i+1;}
  slots.appendChild(d);
 }
}
function renderPalette(){
 palette.innerHTML="";
 for(var i=0;i<34;i++){
  var b=document.createElement("button");
  b.type="button";b.className="tbtn";b.innerHTML=visual(i);
  b.setAttribute("aria-label",names[i]);
  b.disabled=(hand.length>=mode||countTile(i)>=4);
  (function(x){b.addEventListener("click",function(){add(x);});})(i);
  palette.appendChild(b);
 }
}

function shanten(c,target){
 var best=99,a=c.slice();
 function dfs(pos,m,t,pair){
  while(pos<34&&a[pos]===0)pos++;
  if(pos>=34){
   var base=(target===4?8:10);
   var tt=Math.min(t,target-m);
   var s=base-2*m-tt-(pair?1:0);
   if(s<best)best=s;
   return;
  }
  a[pos]--;dfs(pos,m,t,pair);a[pos]++;
  if(a[pos]>=3){a[pos]-=3;dfs(pos+1,m+1,t,pair);a[pos]+=3;}
  if(pos<27&&pos%9<=6&&a[pos+1]>0&&a[pos+2]>0){
   a[pos]--;a[pos+1]--;a[pos+2]--;
   dfs(pos+1,m+1,t,pair);
   a[pos]++;a[pos+1]++;a[pos+2]++;
  }
  if(!pair&&a[pos]>=2){a[pos]-=2;dfs(pos+1,m,t,true);a[pos]+=2;}
  if(a[pos]>=2){a[pos]-=2;dfs(pos+1,m,t+1,pair);a[pos]+=2;}
  if(pos<27&&pos%9<=7&&a[pos+1]>0){a[pos]--;a[pos+1]--;dfs(pos+1,m,t+1,pair);a[pos]++;a[pos+1]++;}
  if(pos<27&&pos%9<=6&&a[pos+2]>0){a[pos]--;a[pos+2]--;dfs(pos+1,m,t+1,pair);a[pos]++;a[pos+2]++;}
 }
 dfs(0,0,0,false);
 return best;
}

function getRoutes(){
 if(hand.length!==mode)return null;
 var target=(mode===13?4:5);
 var base=shanten(counts(hand),target),r=[];
 for(var draw=0;draw<34;draw++){
  if(countTile(draw)>=4)continue;
  var t=hand.slice();t.push(draw);
  for(var j=0;j<t.length;j++){
   var discard=t[j];
   var a=t.slice(0,j).concat(t.slice(j+1));
   var s=shanten(counts(a),target);
   if(s<base)r.push({draw:draw,discard:discard,s:s});
  }
 }
 var min=base;
 if(r.length){min=r[0].s;for(var k=1;k<r.length;k++)if(r[k].s<min)min=r[k].s;}
 return {base:base,min:min,r:r.filter(function(x){return x.s===min;})};
}

function getWaits(){
 var target=(mode===13?4:5),out=[];
 for(var x=0;x<34;x++){
  if(countTile(x)>=4)continue;
  var a=hand.slice();a.push(x);
  if(shanten(counts(a),target)<0)out.push(x);
 }
 return out;
}

function analyze(){
 if(hand.length<mode){
  result.innerHTML='<div class="big">請選 '+mode+' 張牌</div><div class="note">目前 '+hand.length+' / '+mode+' 張。下面的34種牌可以直接點選。</div>';
  return;
 }
 var q=getRoutes(),s=q.base;
 var cls=s===0?"ok":(s<=2?"warn":"bad");
 var text=s===0?"聽牌":s+"進聽";
 var html='<div class="big '+cls+'">'+text+'</div>';
 if(s===0){
  var w=getWaits();
  html+='<div style="margin-top:9px"><b>等待牌：</b></div><div class="chips">';
  if(w.length===0)html+='<span class="chip">一般牌型未找到等待牌</span>';
  else for(var i=0;i<w.length;i++)html+='<span class="chip">'+names[w[i]]+'</span>';
  html+='</div>';
 }else if(q.r.length){
  html+='<div style="margin-top:9px"><b>最快 → '+q.min+'進聽</b></div><div class="chips">';
  var seen={},shown=0;
  for(var j=0;j<q.r.length;j++){
   var key=q.r[j].draw+"-"+q.r[j].discard;
   if(seen[key])continue;seen[key]=1;
   html+='<span class="chip">摸 '+names[q.r[j].draw]+' → 打 '+names[q.r[j].discard]+'</span>';
   shown++;if(shown>=24)break;
  }
  html+='</div><div class="note">'+mode+'張模式同樣完整計算0／1／2進聽。</div>';
 }
 result.innerHTML=html;
}

function add(x){
 if(hand.length>=mode||countTile(x)>=4)return;
 history.push(hand.slice());
 hand.push(x);
 render();
}
function undo(){
 if(!history.length)return;
 var prev=history.pop();
 hand.length=0;
 for(var i=0;i<prev.length;i++)hand.push(prev[i]);
 render();
}
function resetHand(){
 if(hand.length){history.push(hand.slice());hand.length=0;render();}
}
function sortHand(){hand.sort(function(a,b){return a-b;});render();}
function setMode(n){
 mode=n;
 mode13.classList.toggle("active",n===13);
 mode16.classList.toggle("active",n===16);
 history=[];
 hand.length=0;
 render();
}

function render(){renderSlots();renderPalette();analyze();}

mode13.addEventListener("click",function(){setMode(13);});
mode16.addEventListener("click",function(){setMode(16);});
$("undoBtn").addEventListener("click",undo);
$("sortBtn").addEventListener("click",sortHand);
$("resetBtn").addEventListener("click",resetHand);
$("allTab").addEventListener("click",function(){
 $("allTab").classList.add("active");$("codeTab").classList.remove("active");renderPalette();
});
$("codeTab").addEventListener("click",function(){
 $("codeTab").classList.add("active");$("allTab").classList.remove("active");
 palette.innerHTML='<div class="note" style="grid-column:1/-1">牌組代號功能預留。現在請使用「所有牌組」直接選牌。</div>';
});
render();
})();
</script>
<!-- Tile artwork: FluffyStuff/riichi-mahjong-tiles, public domain. -->
</body>
</html>
